port 26379
dir "/data"
sentinel monitor valkey_cluster 172.21.0.3 6379 1
sentinel auth-pass valkey_cluster pass
sentinel down-after-milliseconds valkey_cluster 5000
sentinel failover-timeout valkey_cluster 60000

sentinel deny-scripts-reconfig yes

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* alldbs +@all
sentinel myid 2b6f4f5cfa60cd9d0ceddff209b1b69e5a60627d
sentinel config-epoch valkey_cluster 1
sentinel leader-epoch valkey_cluster 1
sentinel current-epoch 1

sentinel known-replica valkey_cluster 172.21.0.2 6379


services:
    # ====================================================================
    # VALKEY CLUSTER — 3 primary + 3 replica
    # Документация: https://valkey.io/topics/cluster-tutorial/
    # Каждая нода: client port + cluster bus port (+10000)
    # ====================================================================
    valkey_node1:
        image: valkey/valkey:9
        container_name: valkey_node1
        environment:
            - VALKEY_PASSWORD=${VALKEY_PASSWORD}
        volumes:
            - ./valkey-node1-data:/data
        command: >
            valkey-server
            --bind 0.0.0.0
            --requirepass ${VALKEY_PASSWORD}
            --masterauth ${VALKEY_PASSWORD}
            --port 6379
            --cluster-enabled yes
            --cluster-config-file nodes.conf
            --cluster-node-timeout 5000
            --appendonly yes
            --dir /data
        ports:
            - "${VALKEY_NODE1_PORT:-7001}:6379"
            - "${VALKEY_NODE1_BUS_PORT:-17001}:16379"
        networks:
            - valkey_cluster
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 10


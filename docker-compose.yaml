    # ====================================================================
    # PHP 8.5 с phpredis — тест кластера
    # ====================================================================
    php-test:
        build:
            context: .
            dockerfile: ./php/Dockerfile
        container_name: php-test
        volumes:
            - ./php:/app
        environment:
            - VALKEY_PASSWORD=${VALKEY_PASSWORD}
        depends_on:
            - valkey_node1
            - valkey_node2
            - valkey_node3
            - valkey_node4
            - valkey_node5
            - valkey_node6
        networks:
            - db_ha
        command: ["tail", "-f", "/dev/null"]
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

    # ====================================================================
    # KEYDB ACTIVE-REPLICA (Multi-Master)
    # ====================================================================
    keydb_node1:
        image: eqalpha/keydb:x86_64_v6.3.4
        container_name: keydb_node1
        environment:
            - KEYDB_PASSWORD=${KEYDB_PASSWORD}
        volumes:
            - ./keydb-node1-data:/data
        command: >
            keydb-server
            --bind 0.0.0.0
            --requirepass ${KEYDB_PASSWORD}
            --port 6379
            --masterauth ${KEYDB_PASSWORD}
            --active-replica yes
            --multi-master yes
            --replicaof keydb_node2 6379
            --dir /data
        ports:
            - "${KEYDB_NODE1_PORT:-7101}:6379"
        restart: unless-stopped
        networks:
            - db_ha
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "keydb-cli -a $${KEYDB_PASSWORD} PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 10

    keydb_node2:
        image: eqalpha/keydb:x86_64_v6.3.4
        container_name: keydb_node2
        environment:
            - KEYDB_PASSWORD=${KEYDB_PASSWORD}
        volumes:
            - ./keydb-node2-data:/data
        command: >
            keydb-server
            --bind 0.0.0.0
            --requirepass ${KEYDB_PASSWORD}
            --port 6379
            --masterauth ${KEYDB_PASSWORD}
            --active-replica yes
            --multi-master yes
            --replicaof keydb_node1 6379
            --dir /data
        ports:
            - "${KEYDB_NODE2_PORT:-7102}:6379"
        restart: unless-stopped
        networks:
            - db_ha
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "keydb-cli -a $${KEYDB_PASSWORD} PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 10

    haproxy:
        image: haproxy:2.8-alpine
        container_name: haproxy
        ports:
            - "${KEYDB_EXTERNAL_PORT:-6672}:6379"
            - "${HAPROXY_STATS_PORT:-8404}:8404"
        volumes:
            - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        environment:
            - KEYDB_PASSWORD=${KEYDB_PASSWORD}
        depends_on:
            keydb_node1:
                condition: service_healthy
            keydb_node2:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - db_ha
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

networks:
    db_ha:
        driver: bridge

global
log stdout format raw local0
maxconn 4096
# Строка с сокетом удалена, чтобы избежать ошибки прав доступа

defaults
log     global
mode    tcp
option  tcplog
option  dontlognull
timeout connect 5s
timeout client  30m
timeout server  30m
timeout check   5s
retries 3
option  redispatch

# Статистика и health check для Docker
frontend stats
bind *:8404
mode http
stats enable
stats uri /stats
stats refresh 5s
monitor-uri /health

# Основной вход для KeyDB
frontend keydb_frontend
bind *:6379
mode tcp
default_backend keydb_backend

# Балансировка с проверкой здоровья
backend keydb_backend
mode tcp
balance roundrobin

option tcp-check
tcp-check connect
tcp-check send AUTH\ pass\r\n
tcp-check expect string +OK
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK

server node1 keydb_node1:6379 check inter 5s fall 3 rise 2
server node2 keydb_node2:6379 check inter 5s fall 3 rise 2

services:
    # ====================================================================
    # VALKEY PRIMARY + REPLICA + SENTINEL (Active-Passive)
    # ====================================================================
    valkey_primary:
        image: valkey/valkey:9.1-alpine
        container_name: valkey_primary
        environment:
            - VALKEY_PASSWORD=${VALKEY_PASSWORD}
        volumes:
            - ./valkey-primary-data:/data
        command: >
            valkey-server
            --bind 0.0.0.0
            --requirepass ${VALKEY_PASSWORD}
            --masterauth ${VALKEY_PASSWORD}
            --port 6379
            --dir /data
        restart: unless-stopped
        networks:
            - db_ha
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} PING | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 10

    valkey_replica:
        image: valkey/valkey:9.1-alpine
        container_name: valkey_replica
        environment:
            - VALKEY_PASSWORD=${VALKEY_PASSWORD}
        volumes:
            - ./valkey-replica-data:/data
        command: >
            valkey-server
            --bind 0.0.0.0
            --requirepass ${VALKEY_PASSWORD}
            --masterauth ${VALKEY_PASSWORD}
            --port 6379
            --replicaof valkey_primary 6379
            --replica-read-only yes
            --dir /data
        restart: unless-stopped
        networks:
            - db_ha
        depends_on:
            valkey_primary:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} INFO replication | grep master_link_status | grep -q up"]
            interval: 10s
            timeout: 3s
            retries: 10

    valkey_sentinel:
        image: valkey/valkey:9.1-alpine
        container_name: valkey_sentinel
        ports:
            - "${VALKEY_SENTINEL_PORT:-26380}:26379"
        environment:
            - VALKEY_PASSWORD=${VALKEY_PASSWORD}
        volumes:
            - ./valkey-sentinel-data:/data
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                echo "Waiting for Valkey nodes to be available..."
                until getent hosts valkey_primary > /dev/null && getent hosts valkey_replica > /dev/null; do
                  echo "DNS not ready, waiting 2 seconds..."
                  sleep 2
                done

                PRIMARY_IP=$$(getent hosts valkey_primary | awk '{ print $$1 }')
                echo "Resolved Primary IP: $$PRIMARY_IP"

                cat <<EOF > /data/sentinel.conf
                port 26379
                dir /data
                sentinel monitor valkey_cluster $$PRIMARY_IP 6379 1
                sentinel auth-pass valkey_cluster $${VALKEY_PASSWORD}
                sentinel down-after-milliseconds valkey_cluster 2000
                sentinel failover-timeout valkey_cluster 60000
                sentinel parallel-syncs valkey_cluster 1
                sentinel deny-scripts-reconfig yes
                EOF

                echo "Starting Valkey Sentinel..."
                exec valkey-sentinel /data/sentinel.conf
        restart: unless-stopped
        networks:
            - db_ha
        depends_on:
            valkey_primary:
                condition: service_healthy
            valkey_replica:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

networks:
    db_ha:
        driver: bridge

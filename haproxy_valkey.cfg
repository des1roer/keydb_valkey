global
log stdout format raw local0
maxconn 4096

defaults
log     global
mode    tcp
option  tcplog
option  dontlognull
timeout connect 5s
timeout client  30m
timeout server  30m
timeout check   5s
retries 3
option  redispatch

frontend stats
bind *:8404
mode http
stats enable
stats uri /stats
stats refresh 5s
monitor-uri /health

frontend valkey_frontend
bind *:6379
mode tcp
default_backend valkey_backend

backend valkey_backend
mode tcp
# Используем 'first', чтобы направлять трафик на первый доступный узел,
# который пройдет проверку на роль мастера.
balance first

option tcp-check

# 1. Устанавливаем соединение
tcp-check connect

# 2. Авторизуемся
tcp-check send AUTH\ pass\r\n
tcp-check expect string +OK

# 3. Запрашиваем информацию о репликации
tcp-check send INFO\ replication\r\n

# 4. Проверяем, что этот узел именно МАСТЕР.
# Если это реплика, в ответе будет "role:slave", и проверка провалится.
tcp-check expect string role:master

# 5. Корректно закрываем соединение проверки
tcp-check send QUIT\r\n
tcp-check expect string +OK

# Указываем оба узла.
# HAProxy сам определит, кто из них master, с помощью tcp-check выше.
# Тот, кто master, получит статус UP, второй - DOWN.
server valkey_primary valkey_primary:6379 check inter 3s fall 3 rise 2
server valkey_replica valkey_replica:6379 check inter 3s fall 3 rise 2

global
log stdout format raw local0
maxconn 4096

defaults
log     global
mode    tcp
option  tcplog
option  dontlognull
timeout connect 5s
timeout client  30m
timeout server  30m
timeout check   5s
retries 3
option  redispatch

frontend stats
bind *:8404
mode http
stats enable
stats uri /stats
stats refresh 5s
monitor-uri /health

frontend valkey_frontend
bind *:6379
mode tcp
default_backend valkey_backend

backend valkey_backend
mode tcp
balance roundrobin
option tcp-check
tcp-check connect
tcp-check send AUTH\ pass\r\n
tcp-check expect string +OK
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK

# Primary принимает все записи. Replica помечена как backup (вступит в строй при failover)
server primary valkey_primary:6379 check inter 5s fall 3 rise 2
server replica valkey_replica:6379 check inter 5s fall 3 rise 2 backup

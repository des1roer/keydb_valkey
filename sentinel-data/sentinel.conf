port 26379
dir "/data"

sentinel monitor keydb_cluster 172.25.0.10 6379 1
sentinel auth-pass keydb_cluster pass
sentinel down-after-milliseconds keydb_cluster 5000
sentinel failover-timeout keydb_cluster 60000

sentinel monitor keydb_node2 172.25.0.11 6379 1
sentinel auth-pass keydb_node2 pass
sentinel down-after-milliseconds keydb_node2 5000
sentinel failover-timeout keydb_node2 60000

sentinel deny-scripts-reconfig yes
# Generated by CONFIG REWRITE
user default on nopass ~* &* +@all
sentinel myid 86488a66c8ef361602d856709c08c852eeb4abb4
sentinel config-epoch keydb_cluster 0
sentinel leader-epoch keydb_cluster 0
sentinel config-epoch keydb_node2 0
sentinel leader-epoch keydb_node2 0
sentinel current-epoch 0
sentinel known-replica keydb_cluster 172.25.0.11 6379
sentinel known-replica keydb_node2 172.25.0.10 6379

port 26379
dir "/data"
sentinel monitor redis_cluster 172.28.0.2 6379 1
sentinel auth-pass redis_cluster pass
sentinel down-after-milliseconds redis_cluster 5000
sentinel failover-timeout redis_cluster 60000

sentinel deny-scripts-reconfig yes

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* +@all
sentinel myid 423f819874e89b4428f05a0d2af006ee3638964d
sentinel config-epoch redis_cluster 0
sentinel leader-epoch redis_cluster 0
sentinel current-epoch 0

sentinel known-replica redis_cluster 172.28.0.3 6379

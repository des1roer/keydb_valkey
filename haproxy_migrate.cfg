global
log stdout format raw local0
maxconn 4096
stats socket /var/run/haproxy.sock mode 660 level admin

defaults
log     global
mode    tcp
option  tcplog
option  dontlognull
timeout connect 5s
timeout client  30m
timeout server  30m
timeout check   5s
retries 3
option  redispatch

# Runtime API для hot-switch без downtime
resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_type ip
    hold valid 5s

frontend stats
bind *:8404
mode http
stats enable
stats uri /stats
stats refresh 5s
monitor-uri /health

# Единая точка входа
frontend db_frontend
bind *:6379
mode tcp
default_backend keydb_backend

# KeyDB Multi-Master (оба active)
backend keydb_backend
mode tcp
balance roundrobin
option tcp-check
tcp-check connect
tcp-check send AUTH\ pass\r\n
tcp-check expect string +OK
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK
server node1 keydb_node1:6379 check inter 5s fall 3 rise 2 resolvers docker
server node2 keydb_node2:6379 check inter 5s fall 3 rise 2 resolvers docker

# Valkey (primary active, replica — backup)
backend valkey_backend
mode tcp
option tcp-check
tcp-check connect
tcp-check send AUTH\ pass\r\n
tcp-check expect string +OK
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK
server primary valkey_primary:6379 check inter 5s fall 3 rise 2 resolvers docker
server replica  valkey_replica:6379 check inter 5s fall 3 rise 2 resolvers docker backup
